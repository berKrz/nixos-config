[notification]
background_opacity = 0.69999999999999996
border = false
collapse_on_dismiss = true
enable_daemon = true
layer = "top"
offset_x = 8
offset_y = 8
position = "top_right"
scale = 0.90000000000000002

[osd]
background_opacity = 0.69999999999999996
offset_x = 0
offset_y = 48
orientation = "horizontal"
position = "top_center"
scale = 1.0

[plugin_settings."avivbintangaringga/nix-monitor"]
generation_check_interval = 100
show_update_check_notification = true
system_stats_check_interval = 100
system_stats_check_mode = "on_start"
update_check_interval = 100
update_command = "cd ~/nixos-config && nix flake update && sudo nixos-rebuild switch --flake ~/nixos-config#nix-btw"

[plugins]
auto_update = "all"
enabled = [
  "noctalia/bongocat",
  "noctalia/notes",
  "noctalia/countdown_timer",
  "noctalia/mpvpaper",
  "noctalia/wallhaven",
  "noctalia/wallpaper_depth",
  "oldirtty/color_picker",
  "kenn/keybind-cheatsheet",
  "avivbintangaringga/nix-monitor",
]

[[plugins.source]]
name     = "official"
kind     = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled  = true

[[plugins.source]]
name     = "community"
kind     = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled  = true

[shell]
corner_radius_scale = 1.0
font_family = "Noto Sans"
panel_anchor_bar = "default"
polkit_agent = true

    [shell.animation]
    enabled = true
    speed = 1.0

    [shell.launcher]
    auto_paste = "ctrl_v"

        [shell.launcher.providers.windows]
        global = true
        prefix = ""

    [shell.panel]
    transparency_mode = "glass"

    [shell.screenshot]
    save_to_file = false

    [shell.shadow]
    alpha = 0.40000000000000002

[system.monitor]
gpu_poll_seconds = 5

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
custom_palette = "My Custom Palette"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/berkrz/Pictures/Wallpapers/joi.jpg"

    [wallpaper.last]
    path = "/home/berkrz/Pictures/Wallpapers/joi.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/berkrz/Pictures/Wallpapers/joi.jpg"

[weather]
refresh_minutes = 10

[widget.active_window]
display = "icon_only"
enabled = false
max_length = 40
type = "active_window"

[widget.battery]
display_mode = "graphic"
type = "battery"

[widget.cat]
capsule = true
enable_scroll = false
input_devices = [ "/dev/input/event0" ]
scale = 1.25
tappy_mode = false
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%H:%M  %a, %d %b}"
tooltip_format = "{:%A, %d %B %Y}"
type = "clock"

[widget.keyboard_layout]
type = "keyboard_layout"

[widget.network]
type = "network"

[widget.nix-monitor]
checking_glyph = "cloud-search"
colorize_glyph = false
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"
up_to_date_glyph = "cloud-check"

[widget.spacer_2]
length = 25
type = "spacer"

[widget.spacer_3]
anchor = true
length = 50
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.taskbar]
group_by_workspace = true
show_workspace_label = false

[widget.volume]
show_label = true
type = "volume"

[widget.workspaces]
enabled = false
label_source = "id"
show_empty = false
show_labels = true
type = "workspaces"
