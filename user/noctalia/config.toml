[accessibility]
ui_scale = 1.1000000089406967

[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
center = [ "workspaces" ]
concave_edge_corners = false
end = [ "group:g2", "battery", "volume", "keyboard_layout", "session" ]
margin_ends = 0
panel_overlap = 0
scale = 1.1000000089406967
start = [ "group:g1", "clock" ]
thickness = 42

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "control-center", "launcher", "notifications" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 15

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "system"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_scale = 1.1000000163912773
background_opacity = 0.89999997988343239
enabled = true
icon_size = 38
launcher_position = "start"
magnification_scale = 1.2000000029802322
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 120.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
address = "Ponta Grossa, Brazil"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1645.5
    cy = 364.5
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        center_text = false
        color = "primary"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1646.0
    cy = 494.60000610351562
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

[notification]
border = false

[shell.panel]
borders = false
clipboard_placement = "attached"
clipboard_position = "auto"
launcher_placement = "attached"
list_item_background = true
polkit_placement = "attached"

[shell.screen_corners]
enabled = true

[shell.shadow]
alpha = 0.76999998278915882

[system.monitor]
gpu_poll_seconds = 5

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty", "mango" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/nix/store/mz4xddjyzlix9vyn96n2qbpnl6fyz1aq-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/nix/store/mz4xddjyzlix9vyn96n2qbpnl6fyz1aq-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

[weather]
refresh_minutes = 10

[widget.active_window]
icon_size = 22

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%H:%M %d/%m/%y}"

[widget.control-center]
glyph = "settings"

[widget.network]
show_label = false

[widget.workspaces]
capsule_radius = "auto"
display = "name"
hide_when_empty = true
scale = 1.2
